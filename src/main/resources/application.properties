
spring.application.name=Authentication Service
server.port=8081
server.address=0.0.0.0

spring.datasource.url=jdbc:postgresql://localhost:5432/authentication
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false


spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
spring.data.redis.database=0
spring.data.redis.lettuce.pool.max-active=10
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

jwt.secret=${JWT_SECRET:Ch4ng3M3InPr0duct10n!Th1sIsA512BitS3cr3tK3yF0rJWTAuth3ntic4t10nSyst3m!!}
jwt.expiration=900000
jwt.refresh-expiration=604800000

app.jwtSecret=${jwt.secret}
app.jwtExpirationInMs=${jwt.expiration}
app.jwtRefreshExpirationInMs=${jwt.refresh-expiration}

app.oauth2.authorizedRedirectUris=http://localhost:3000/oauth2/redirect


logging.level.com.example.AuthenticationBackedJava=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.data.redis=WARN